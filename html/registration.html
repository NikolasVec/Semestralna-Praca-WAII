
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beh po pivo | Registrácia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-container">

    <!-- Bocny navigacny panel -->
    <aside class="sidebar">

        <div class="logo">
            <a href="index.html">
                <img src="images/LogoOBR.png" alt="Beh po pivo - hlavná stránka">
            </a>
        </div>

        <nav class="navigation" aria-label="Hlavná navigácia">
            <a href="registration.html">REGISTRÁCIA</a>
            <a href="#">MAPA</a>
            <a href="#">VÝSLEDKY</a>
            <a href="#">GALÉRIA</a>
        </nav>


    </aside>

    <!-- Hlavny obsah -->
    <main class="main-content">

        <section class="registration">
            <h1>Registrácia</h1>

            <form class="registration-form">

                <label for="first-name">Meno</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="last-name">Priezvisko</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="birth-date">Dátum narodenia</label>
                <input type="date" id="birth-date" name="birth-date" required>

                <button type="submit">REGISTROVAŤ SA</button>

            </form>
        </section>


    </main>

</div>

<!-- Paticka stranky -->
<footer class="footer">

    <!-- Odkaz pre administratora -->
    <a href="#" class="admin-link" aria-label="Administrátor">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="7" r="5" fill="white"/>
            <path d="M2 22 C2 12, 22 12, 22 22 Z" fill="white"/>
        </svg>
    </a>

    <p>© 2026 Beh po pivo. Všetky práva vyhradené.</p>
</footer>

</body>
</html>
